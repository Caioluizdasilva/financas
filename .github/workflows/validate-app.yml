name: Validate Finanças app

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check auth.js
          node --check seed.js
