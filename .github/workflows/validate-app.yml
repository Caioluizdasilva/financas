name: Validate Finanças app

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Sintaxe, cache offline e cálculos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax and offline cache
        run: node scripts/check-app.mjs
      - name: Test financial calculations
        run: node --test tests/unit/*.test.mjs

  sync:
    name: Sincronização e modo offline (navegador)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: pip install playwright==1.63.0 && python -m playwright install chromium
      - name: Test cloud sync and offline startup
        run: python tests/sync/sync_test.py
